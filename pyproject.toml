[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-lab-voice"
version = "1.0.0"
description = "Typed contracts and applications for a private home-lab voice system"
requires-python = ">=3.11"
authors = [{name = "Saurabh Chase"}]
dependencies = []

[project.optional-dependencies]
audio = ["sounddevice==0.5.6"]
asr = ["faster-whisper==1.2.1"]
vad = ["silero-vad==6.2.3", "onnxruntime==1.30.0"]
tts = [
  "kokoro==0.9.4",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
]
full = [
  "sounddevice==0.5.6",
  "faster-whisper==1.2.1",
  "silero-vad==6.2.3",
  "onnxruntime==1.30.0",
  "kokoro==0.9.4",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
]

[project.scripts]
home-lab-voice = "home_lab_voice.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
home_lab_voice = ["py.typed"]
